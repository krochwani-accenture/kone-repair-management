AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: SAM template for Repairs Lambda and DynamoDB table

Globals:
  Api:
    Cors:
      AllowMethods: "'GET,POST,PUT,OPTIONS'"
      AllowHeaders: "'Content-Type,Authorization'"
      AllowOrigin: "'*'"
Resources:
  RepairsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-Repairs"
      AttributeDefinitions:
        - AttributeName: repair_id
          AttributeType: S
      KeySchema:
        - AttributeName: repair_id
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST

  RepairUploadsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${AWS::StackName}-repair-uploads"
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins: ["*"]
            AllowedMethods: ["GET", "PUT", "POST", "HEAD"]
            AllowedHeaders: ["*"]
            MaxAge: 3000

  RepairsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: lambda/repairsHandler.handler
      Runtime: nodejs18.x
      CodeUri: backend/
      MemorySize: 256
      Timeout: 30
      Environment:
        Variables:
          DYNAMO_TABLE_NAME: !Ref RepairsTable
          AWS_NODEJS_CONNECTION_REUSE_ENABLED: "1"
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref RepairsTable
      Events:
        ApiAuth:
          Type: Api
          Properties:
            Path: /auth/{proxy+}
            Method: ANY
        ApiUploadInfo:
          Type: Api
          Properties:
            Path: /upload/info
            Method: POST
        ApiUpload:
          Type: Api
          Properties:
            Path: /upload
            Method: POST
        ApiRepairsRoot:
          Type: Api
          Properties:
            Path: /repairs
            Method: ANY
        ApiRepairs:
          Type: Api
          Properties:
            Path: /repairs/{proxy+}
            Method: ANY

  S3UploadUrlFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: lambda/s3UploadHandler.handler
      Runtime: nodejs18.x
      CodeUri: backend/
      MemorySize: 256
      Timeout: 30
      Environment:
        Variables:
          UPLOAD_BUCKET_NAME: !Sub "${AWS::StackName}-repair-uploads"
          AWS_NODEJS_CONNECTION_REUSE_ENABLED: "1"
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - s3:PutObject
              Resource: !Sub "arn:aws:s3:::${AWS::StackName}-repair-uploads/uploads/*"
      Events:
        ApiUploadUrl:
          Type: Api
          Properties:
            Path: /upload/url
            Method: GET

  RepairProcessorFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: lambda/s3Processor.handler
      Runtime: nodejs18.x
      CodeUri: backend/
      MemorySize: 256
      Timeout: 60
      Environment:
        Variables:
          UPLOAD_BUCKET_NAME: !Sub "${AWS::StackName}-repair-uploads"
          DYNAMO_TABLE_NAME: !Ref RepairsTable
          AWS_NODEJS_CONNECTION_REUSE_ENABLED: "1"
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref RepairsTable
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - s3:GetObject
              Resource: !Sub "arn:aws:s3:::${AWS::StackName}-repair-uploads/uploads/*"
      Events:
        UploadEvent:
          Type: S3
          Properties:
            Bucket: !Ref RepairUploadsBucket
            Events: s3:ObjectCreated:Put
            Filter:
              S3Key:
                Rules:
                  - Name: suffix
                    Value: .xlsx
                    
  StreamProcessorFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: lambda/streamProcessor.handler
      Runtime: nodejs18.x
      CodeUri: backend/
      MemorySize: 256
      Timeout: 60
      Environment:
        Variables:
          CHANGELOG_TABLE_NAME: !Ref ChangeLogTable
          AWS_REGION: !Ref AWS::Region
      Policies:
      - DynamoDBCrudPolicy:
          TableName: !Ref ChangeLogTable
      Events:
        DynamoDBStream:
          Type: DynamoDB
          Properties:
            Stream: !GetAtt RepairsTable.StreamArn
            StartingPosition: TRIM_HORIZON
            BatchSize: 100

  ChangeLogTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-RepairsChangeLog"
      AttributeDefinitions:
      - AttributeName: repairId
        AttributeType: S
      - AttributeName: eventTimestamp
        AttributeType: S
      KeySchema:
      - AttributeName: repairId
        KeyType: HASH
      - AttributeName: eventTimestamp
        KeyType: RANGE
      BillingMode: PAY_PER_REQUEST
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

Outputs:
  RepairsApi:
    Description: "Repairs API Gateway endpoint"
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod"
  RepairsApiAuthLogin:
    Description: "Auth login endpoint"
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/auth/login"
  RepairsApiRepairs:
    Description: "Repairs endpoint"
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/repairs"
  RepairsUploadUrl:
    Description: "S3 upload URL endpoint"
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/upload/url"
  RepairUploadsBucketName:
    Description: "S3 bucket for uploaded repair files"
    Value: !Ref RepairUploadsBucket
