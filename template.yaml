AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: SAM template for Repairs Lambda and DynamoDB table

Resources:
  RepairsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: Repairs
      AttributeDefinitions:
        - AttributeName: repair_id
          AttributeType: S
      KeySchema:
        - AttributeName: repair_id
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST

  RepairsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: backend/lambda/repairsHandler.handler
      Runtime: nodejs18.x
      CodeUri: .
      MemorySize: 256
      Timeout: 15
      Environment:
        Variables:
          DYNAMO_TABLE_NAME: !Ref RepairsTable
          AWS_NODEJS_CONNECTION_REUSE_ENABLED: '1'
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref RepairsTable
      Events:
        Api:
          Type: Api
          Properties:
            Path: /repairs/{proxy+}
            Method: ANY

Outputs:
  RepairsApi:
    Description: "Repairs API endpoint"
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/repairs"
