AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: SAM template for Repairs Lambda and DynamoDB table

Resources:
  RepairsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-Repairs"
      AttributeDefinitions:
        - AttributeName: repair_id
          AttributeType: S
      KeySchema:
        - AttributeName: repair_id
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST

  RepairsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: lambda/repairsHandler.handler
      Runtime: nodejs18.x
      CodeUri: backend/ 
      MemorySize: 256
      Timeout: 30
      Environment:
        Variables:
          DYNAMO_TABLE_NAME: !Ref RepairsTable
          AWS_NODEJS_CONNECTION_REUSE_ENABLED: '1'
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref RepairsTable
      Events:
        ApiAuth:
          Type: Api
          Properties:
            Path: /auth/{proxy+}
            Method: ANY
        ApiUploadInfo:
          Type: Api
          Properties:
            Path: /upload/info
            Method: POST
        ApiUpload:
          Type: Api
          Properties:
            Path: /upload
            Method: POST
        ApiRepairs:
          Type: Api
          Properties:
            Path: /repairs/{proxy+}
            Method: ANY

Outputs:
  RepairsApi:
    Description: "Repairs API Gateway endpoint"
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod"
  RepairsApiAuthLogin:
    Description: "Auth login endpoint"
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/auth/login"
  RepairsApiRepairs:
    Description: "Repairs endpoint"
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/repairs"
